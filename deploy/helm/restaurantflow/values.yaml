nameOverride: restaurantflow

image:
  repositoryPrefix: restaurantflow
  tag: latest
  pullPolicy: IfNotPresent

rabbitmq:
  image: rabbitmq:4.2-management-alpine
  username: restaurantflow
  password: restaurantflow

postgres:
  image: postgres:18-alpine
  password: postgres
  storage: 1Gi

authentication:
  enabled: true
  authority: https://identity.example.com/realms/restaurantflow
  audience: restaurantflow-api
  requireHttpsMetadata: true
  tokenEndpoint: https://identity.example.com/realms/restaurantflow/protocol/openid-connect/token
  ordersClientId: orders-service
  ordersClientSecret: replace-in-secret-store

services:
  gateway:
    image: gateway
    replicas: 2
    port: 8080
    public: true
    healthPath: /health
  menu-api:
    image: menu-api
    replicas: 2
    port: 8080
    database: menu
    healthPath: /health
  orders-api:
    image: orders-api
    replicas: 2
    port: 8080
    database: orders
    healthPath: /health
  kitchen-api:
    image: kitchen-api
    replicas: 2
    port: 8080
    database: kitchen
    healthPath: /health
  payments-api:
    image: payments-api
    replicas: 2
    port: 8080
    database: payments
    healthPath: /health
  notifications-worker:
    image: notifications-worker
    replicas: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
