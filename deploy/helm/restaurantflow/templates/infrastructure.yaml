{{- if .Values.infrastructure.deployRabbitMq }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq }
    spec:
      serviceAccountName: {{ include "restaurantflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: {{ include "restaurantflow.secretName" . }}, key: rabbitmq-username } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ include "restaurantflow.secretName" . }}, key: rabbitmq-password } }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
---
{{- end }}
{{- if .Values.infrastructure.deployPostgres }}
{{- range $database := list "menu" "orders" "kitchen" "payments" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $database }}-db
  namespace: {{ $.Release.Namespace }}
spec:
  serviceName: {{ $database }}-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $database }}-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $database }}-db }
    spec:
      serviceAccountName: {{ include "restaurantflow.serviceAccountName" $ }}
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ $database }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "restaurantflow.secretName" $ }}, key: postgres-password } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ $.Values.postgres.storage }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $database }}-db
  namespace: {{ $.Release.Namespace }}
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: {{ $database }}-db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
{{- end }}
{{- end }}
