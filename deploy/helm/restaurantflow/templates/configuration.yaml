{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "restaurantflow.secretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  rabbitmq-username: {{ .Values.rabbitmq.username | quote }}
  rabbitmq-password: {{ .Values.rabbitmq.password | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
  orders-client-secret: {{ .Values.authentication.ordersClientSecret | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurantflow-config
  namespace: {{ .Release.Namespace }}
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  RabbitMq__Host: {{ .Values.rabbitmq.host | quote }}
  Services__Menu: http://menu-api:8080
  Authentication__Enabled: {{ .Values.authentication.enabled | quote }}
  Authentication__Authority: {{ .Values.authentication.authority | quote }}
  Authentication__Audience: {{ .Values.authentication.audience | quote }}
  Authentication__RequireHttpsMetadata: {{ .Values.authentication.requireHttpsMetadata | quote }}
  Authentication__TokenEndpoint: {{ .Values.authentication.tokenEndpoint | quote }}
  Authentication__ClientId: {{ .Values.authentication.ordersClientId | quote }}
