{{- range $name, $service := .Values.services }}
{{- if $service.database }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrations-{{ $.Release.Revision }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}-migrations
    {{- include "restaurantflow.labels" $ | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}-migrations
        app.kubernetes.io/part-of: restaurantflow
    spec:
      serviceAccountName: {{ include "restaurantflow.serviceAccountName" $ }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: "{{ $.Values.image.repositoryPrefix }}-{{ $service.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- if $.Values.externalConnections.enabled }}
            - name: ConnectionStrings__Database
              valueFrom: { secretKeyRef: { name: {{ include "restaurantflow.secretName" $ }}, key: {{ $service.database }}-connection } }
            {{- else }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "restaurantflow.secretName" $ }}, key: postgres-password } }
            - name: ConnectionStrings__Database
              value: "Host={{ $service.database }}-db;Database={{ $service.database }};Username=postgres;Password=$(POSTGRES_PASSWORD)"
            {{- end }}
            - name: Database__Migrate
              value: "true"
            - name: Database__MigrationsOnly
              value: "true"
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
{{- end }}
