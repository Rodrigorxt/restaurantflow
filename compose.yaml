name: restaurantflow

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  Authentication__Enabled: "true"
  Authentication__Authority: http://keycloak:8080/realms/restaurantflow
  Authentication__Audience: restaurantflow-api
  Authentication__RequireHttpsMetadata: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: restaurantflow
  RabbitMq__Password: restaurantflow

services:
  web:
    build:
      context: .
      dockerfile: src/Web/RestaurantFlow.Web/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      - gateway
      - keycloak

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/RestaurantFlow.Gateway/Dockerfile
    environment:
      <<: *api-environment
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
      - menu-api
      - orders-api
      - kitchen-api
      - payments-api

  menu-api:
    build:
      context: .
      dockerfile: src/Services/Menu/RestaurantFlow.Menu.Api/Dockerfile
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=menu-db;Database=menu;Username=postgres;Password=postgres
    depends_on:
      menu-db:
        condition: service_healthy
      menu-migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  menu-migrations:
    build:
      context: .
      dockerfile: src/Services/Menu/RestaurantFlow.Menu.Api/Dockerfile
    environment:
      ConnectionStrings__Database: Host=menu-db;Database=menu;Username=postgres;Password=postgres
      Database__Migrate: "true"
      Database__MigrationsOnly: "true"
    depends_on:
      menu-db:
        condition: service_healthy
    restart: "no"

  orders-api:
    build:
      context: .
      dockerfile: src/Services/Orders/RestaurantFlow.Orders.Api/Dockerfile
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=orders-db;Database=orders;Username=postgres;Password=postgres
      Services__Menu: http://menu-api:8080
      Authentication__TokenEndpoint: http://keycloak:8080/realms/restaurantflow/protocol/openid-connect/token
      Authentication__ClientId: orders-service
      Authentication__ClientSecret: local-orders-secret
      OrderWorkflow__PaymentTimeout: "00:00:15"
      OrderWorkflow__KitchenAcceptanceTimeout: "00:00:15"
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      menu-api:
        condition: service_started
      orders-migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  orders-migrations:
    build:
      context: .
      dockerfile: src/Services/Orders/RestaurantFlow.Orders.Api/Dockerfile
    environment:
      ConnectionStrings__Database: Host=orders-db;Database=orders;Username=postgres;Password=postgres
      Database__Migrate: "true"
      Database__MigrationsOnly: "true"
    depends_on:
      orders-db:
        condition: service_healthy
    restart: "no"

  kitchen-api:
    build:
      context: .
      dockerfile: src/Services/Kitchen/RestaurantFlow.Kitchen.Api/Dockerfile
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=kitchen-db;Database=kitchen;Username=postgres;Password=postgres
    depends_on:
      kitchen-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kitchen-migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  kitchen-migrations:
    build:
      context: .
      dockerfile: src/Services/Kitchen/RestaurantFlow.Kitchen.Api/Dockerfile
    environment:
      ConnectionStrings__Database: Host=kitchen-db;Database=kitchen;Username=postgres;Password=postgres
      Database__Migrate: "true"
      Database__MigrationsOnly: "true"
    depends_on:
      kitchen-db:
        condition: service_healthy
    restart: "no"

  payments-api:
    build:
      context: .
      dockerfile: src/Services/Payments/RestaurantFlow.Payments.Api/Dockerfile
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Host=payments-db;Database=payments;Username=postgres;Password=postgres
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payments-migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  payments-migrations:
    build:
      context: .
      dockerfile: src/Services/Payments/RestaurantFlow.Payments.Api/Dockerfile
    environment:
      ConnectionStrings__Database: Host=payments-db;Database=payments;Username=postgres;Password=postgres
      Database__Migrate: "true"
      Database__MigrationsOnly: "true"
    depends_on:
      payments-db:
        condition: service_healthy
    restart: "no"

  notifications-worker:
    build:
      context: .
      dockerfile: src/Services/Notifications/RestaurantFlow.Notifications.Worker/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: restaurantflow
      RabbitMq__Password: restaurantflow
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      rabbitmq:
        condition: service_healthy

  k6:
    image: grafana/k6:2.1.0
    profiles: ["performance"]
    environment:
      BASE_URL: http://gateway:8080
      IDENTITY_URL: http://keycloak:8080
    volumes:
      - ./tests/performance:/scripts:ro
    depends_on:
      - gateway
      - keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/restaurantflow-realm.json:/opt/keycloak/data/import/restaurantflow-realm.json:ro
    ports:
      - "8081:8080"

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: restaurantflow
      RABBITMQ_DEFAULT_PASS: restaurantflow
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.10.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.7.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  menu-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: menu, POSTGRES_PASSWORD: postgres }
    volumes: [menu-data:/var/lib/postgresql]
    healthcheck: &postgres-health
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: orders, POSTGRES_PASSWORD: postgres }
    volumes: [orders-data:/var/lib/postgresql]
    healthcheck: *postgres-health

  kitchen-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: kitchen, POSTGRES_PASSWORD: postgres }
    volumes: [kitchen-data:/var/lib/postgresql]
    healthcheck: *postgres-health

  payments-db:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: payments, POSTGRES_PASSWORD: postgres }
    volumes: [payments-data:/var/lib/postgresql]
    healthcheck: *postgres-health

volumes:
  menu-data:
  orders-data:
  kitchen-data:
  payments-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
